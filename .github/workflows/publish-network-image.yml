name: Publish network Alloy image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag (also pushed as latest)
        default: v0.1.0
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout guide
        uses: actions/checkout@v4

      - name: Checkout Mesverrum/alloy network-snmp
        uses: actions/checkout@v4
        with:
          repository: Mesverrum/alloy
          ref: network-snmp
          path: _alloy

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build overlay image
        env:
          ALLOY_SRC: ${{ github.workspace }}/_alloy
          ALLOY_IMAGE: ghcr.io/mesverrum/alloy-network:${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          sed -i 's/\r$//' scripts/build-network-image.sh
          bash scripts/build-network-image.sh
          extra="ghcr.io/mesverrum/alloy-network:latest"
          docker tag "$ALLOY_IMAGE" "$extra"
          echo "ALLOY_IMAGE=$ALLOY_IMAGE" >> "$GITHUB_ENV"
          echo "ALLOY_LATEST=$extra" >> "$GITHUB_ENV"

      - name: Push
        run: |
          docker push "$ALLOY_IMAGE"
          docker push "$ALLOY_LATEST"

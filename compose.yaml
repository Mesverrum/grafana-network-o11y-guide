# One Alloy: SNMP discover+poll, traps, syslog, netflow/sflow → Grafana Cloud.
# Requires ALLOY_IMAGE with discovery.snmp + otelcol.receiver.snmptrap + netflow
# (Mesverrum/alloy branch network-snmp until those land in grafana/alloy).
#
# UDP 162 / 1514 / 2055 / 6344 often need host networking or cap_add NET_BIND_SERVICE
# if you want privileged trap/syslog ports. Defaults below are unprivileged.

services:
  alloy:
    image: ${ALLOY_IMAGE:-alloy-network:dev}
    container_name: alloy-network
    restart: unless-stopped
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
      - --stability.level=experimental
      - /etc/alloy/config.alloy
    env_file:
      - .env
    environment:
      GC_OTLP_URL: ${GC_OTLP_URL}
      GC_OTLP_ACCOUNT: ${GC_OTLP_ACCOUNT}
      GC_OTLP_KEY: ${GC_OTLP_KEY}
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ./alloy/auths.yml:/etc/alloy/auths.yml:ro
      - alloy-data:/var/lib/alloy/data
    ports:
      - "12345:12345"   # Alloy UI
      - "11620:11620/udp"  # SNMP traps (unprivileged; cutover often uses 1620)
      - "1514:1514/udp"    # syslog
      - "2055:2055/udp"    # NetFlow/IPFIX
      - "6344:6344/udp"    # sFlow
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  alloy-data:

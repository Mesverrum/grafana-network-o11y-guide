# Default path: Linux Docker, host network, public image.
# Host networking is required so SNMP / traps / flow use the poller's
# management IPs. `ports:` is ignored in this mode — Alloy binds on the host
# (:12345 UI, :11620 traps, :1514 syslog, :2055 NetFlow, :6344 sFlow).
#
# Docker Desktop (Mac / Windows) cannot see a campus management VLAN.
# Run this on a Linux host that can already `snmpget` the devices.
#
# Image: docs/install-alloy.md. Override ALLOY_IMAGE in .env to compile.

services:
  alloy:
    image: ${ALLOY_IMAGE:-ghcr.io/mesverrum/alloy-network:v0.1.0}
    container_name: alloy-network
    restart: unless-stopped
    network_mode: host
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
      - --stability.level=experimental
      - /etc/alloy/config.alloy
    env_file:
      - .env
    environment:
      GC_OTLP_URL: ${GC_OTLP_URL}
      GC_OTLP_ACCOUNT: ${GC_OTLP_ACCOUNT}
      GC_OTLP_KEY: ${GC_OTLP_KEY}
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ./alloy/auths.yml:/etc/alloy/auths.yml:ro
      - alloy-data:/var/lib/alloy/data

volumes:
  alloy-data:
